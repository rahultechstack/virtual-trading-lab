# ---------------------------------------------------------------------------
# Stage 1 infrastructure: PostgreSQL only.
# Redis is intentionally NOT included; it is added in a later stage when a
# concrete need exists (pub/sub fan-out or market-data caching).
# ---------------------------------------------------------------------------
services:
  postgres:
    image: postgres:16-alpine
    container_name: vtrader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vtrader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vtrader_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-virtual_trading}
      # Deterministic timezone; NSE session logic in later stages depends on it.
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vtrader} -d ${POSTGRES_DB:-virtual_trading}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: vtrader_postgres_data
